name: R2 one-time integrity synchronisation

on:
  push:
    branches:
      - docs/v2.2.0-metadata-reproduction-hardening

permissions:
  contents: write

jobs:
  synchronise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: docs/v2.2.0-metadata-reproduction-hardening
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'

      - name: Regenerate integrity catalogues and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r2-sync-integrity.yml
          python scripts/rebuild_integrity_files.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A FILE_MANIFEST.tsv SHA256SUMS.txt .github/workflows/r2-sync-integrity.yml
          git commit -m 'chore(integrity): synchronise R2 documentation patch'
          git push origin HEAD:docs/v2.2.0-metadata-reproduction-hardening
