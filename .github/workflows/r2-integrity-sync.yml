name: R2 documentation integrity synchronisation

on:
  push:
    branches:
      - docs/jors-r2-metadata-hardening

permissions:
  contents: write

jobs:
  synchronise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Remove one-time workflow and rebuild integrity catalogues
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r2-integrity-sync.yml
          python scripts/rebuild_integrity_files.py
          python scripts/verify_file_manifest.py FILE_MANIFEST.tsv
          python scripts/verify_sha256sums.py SHA256SUMS.txt

      - name: Commit the synchronised documentation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(docs): synchronise R2 integrity catalogues'
          git push origin HEAD:docs/jors-r2-metadata-hardening
